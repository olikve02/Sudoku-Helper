<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Bakgrunn: mørk avrundet firkant, samme farge som appen -->
  <rect width="512" height="512" rx="112" fill="#16171d"/>

  <!-- Søkerhjørner, som rammen i kameraet -->
  <g fill="none" stroke="#a78bfa" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 146 V100 a30 30 0 0 1 30 -30 H146"/>
    <path d="M366 70 H412 a30 30 0 0 1 30 30 V146"/>
    <path d="M442 366 V412 a30 30 0 0 1 -30 30 H366"/>
    <path d="M146 442 H100 a30 30 0 0 1 -30 -30 V366"/>
  </g>

  <!-- 3×3-rute fra et sudokubrett -->
  <g fill="#262731">
    <rect x="104" y="104" width="92" height="92" rx="18"/>
    <rect x="210" y="104" width="92" height="92" rx="18"/>
    <rect x="316" y="104" width="92" height="92" rx="18"/>
    <rect x="104" y="210" width="92" height="92" rx="18"/>
    <rect x="316" y="210" width="92" height="92" rx="18"/>
    <rect x="104" y="316" width="92" height="92" rx="18"/>
    <rect x="210" y="316" width="92" height="92" rx="18"/>
    <rect x="316" y="316" width="92" height="92" rx="18"/>
  </g>

  <!-- Den "valgte" cella i midten -->
  <rect x="210" y="210" width="92" height="92" rx="18" fill="#8b7cf6"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="150" y="172" font-size="64" fill="#e5e7eb">7</text>
    <text x="362" y="172" font-size="64" fill="#e5e7eb">2</text>
    <text x="256" y="278" font-size="68" fill="#ffffff">5</text>
    <text x="150" y="384" font-size="64" fill="#e5e7eb">9</text>
    <text x="362" y="384" font-size="64" fill="#e5e7eb">4</text>
  </g>
</svg>
